name: Sync ArenaSystem Client Update Manifest

on:
  release:
    types: [published]
  pull_request:
    paths:
      - ".github/workflows/sync-client-update-manifest.yml"
      - ".github/scripts/sync-client-update-manifest.sh"
      - "README.md"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing stable Fabric release tag to sync (for example Fabric)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate workflow and manifest script
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check manifest sync script syntax
        run: bash -n .github/scripts/sync-client-update-manifest.sh
      - name: Parse workflow YAML
        run: ruby -e 'require "yaml"; YAML.load_file(".github/workflows/sync-client-update-manifest.yml"); puts "Workflow YAML parsed successfully."'

  sync-client-manifest:
    name: Verify release assets and publish update manifest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' &&
       github.event.action == 'published' &&
       github.event.release.draft == false &&
       github.event.release.prerelease == false)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out distribution main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify client release assets and update manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: bash .github/scripts/sync-client-update-manifest.sh
