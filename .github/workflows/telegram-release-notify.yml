name: Telegram Release Announcer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      test_message:
        description: Send a test message to verify the Telegram bot configuration
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  announce:
    name: Announce newly published stable releases
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'release' &&
       github.event.action == 'published' &&
       github.event.release.draft == false &&
       github.event.release.prerelease == false) ||
      (github.event_name == 'workflow_dispatch' && inputs.test_message == true)
    steps:
      - name: Send Telegram announcement
        uses: actions/github-script@v9
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
        with:
          script: |
            const token = process.env.TELEGRAM_BOT_TOKEN?.trim();
            const chatId = process.env.TELEGRAM_CHAT_ID?.trim();
            const threadIdValue = process.env.TELEGRAM_MESSAGE_THREAD_ID?.trim();

            if (!token || !chatId) {
              throw new Error(
                "Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID repository secret."
              );
            }

            let messageThreadId;
            if (threadIdValue) {
              messageThreadId = Number(threadIdValue);
              if (!Number.isSafeInteger(messageThreadId) || messageThreadId <= 0) {
                throw new Error("TELEGRAM_MESSAGE_THREAD_ID must be a positive integer.");
              }
            }

            async function sendTelegramMessage(text, replyMarkup) {
              const body = {
                chat_id: chatId,
                text,
                disable_web_page_preview: true
              };
              if (messageThreadId !== undefined) {
                body.message_thread_id = messageThreadId;
              }
              if (replyMarkup) {
                body.reply_markup = replyMarkup;
              }

              const endpoint = "https://api.telegram.org/bot" + token + "/sendMessage";
              const response = await fetch(endpoint, {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify(body)
              });

              const result = await response.json().catch(() => null);
              if (!response.ok || !result?.ok) {
                const reason = result?.description || ("HTTP " + response.status);
                throw new Error("Telegram sendMessage failed: " + reason);
              }

              core.info("Telegram message sent. Message ID: " +
                (result.result?.message_id ?? "unknown"));
            }

            if (context.eventName === "workflow_dispatch") {
              const testText = [
                "✅ ArenaSystem Update Bot is connected.",
                "",
                "This is a configuration test from GitHub Actions.",
                "New stable releases will be announced here when published.",
                "JAR files uploaded later will be announced by the ArenaSystem Java bot.",
                "",
                "Repository: https://github.com/" +
                  context.repo.owner + "/" + context.repo.repo
              ].join("\n");

              await sendTelegramMessage(testText);
              return;
            }

            const release = context.payload.release;
            if (!release || release.draft || release.prerelease) {
              core.info("Skipping draft or prerelease.");
              return;
            }

            const cleanNotes = (release.body || "No release notes were provided.")
              .replace(/\r\n/g, "\n")
              .replace(/^\s*#{1,6}\s*/gm, "")
              .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, "$1 ($2)")
              .replace(/\*\*(.*?)\*\*/g, "$1")
              .replace(/__(.*?)__/g, "$1")
              .replaceAll(String.fromCharCode(96), "")
              .replace(/^\s*[-*]\s+/gm, "• ")
              .replace(/\n{3,}/g, "\n\n")
              .trim();

            const uploadedAssets = (release.assets || [])
              .filter(asset => asset.state === "uploaded" && asset.browser_download_url);

            const title = release.name || release.tag_name || "ArenaSystem update";
            const version = release.tag_name || "Not specified";
            const publishedAt = release.published_at
              ? new Date(release.published_at).toISOString()
                  .replace("T", " ").slice(0, 16) + " UTC"
              : "Not specified";
            const releaseUrl = release.html_url ||
              ("https://github.com/" + context.repo.owner + "/" +
                context.repo.repo + "/releases");

            const prefix = [
              "🚀 ARENASYSTEM — STABLE RELEASE",
              "",
              title,
              "Versi: " + version,
              "Diterbitkan: " + publishedAt,
              "",
              "Catatan rilis:"
            ].join("\n");

            const downloads = uploadedAssets.length
              ? uploadedAssets.slice(0, 8).map(asset =>
                  "• " + asset.name + "\n  " + asset.browser_download_url
                ).join("\n")
              : "Belum ada file unduhan yang dilampirkan.";

            const suffix = [
              "",
              "",
              uploadedAssets.some(asset => /\.jar$/i.test(asset.name))
                ? "File JAR tersedia melalui tombol unduhan."
                : "File JAR yang diunggah setelah publikasi akan diumumkan otomatis oleh bot.",
              "",
              "Buka Release:",
              releaseUrl
            ].join("\n");

            const maxLength = 3900;
            let notes = cleanNotes;
            let message = prefix + "\n" + notes + "\n\nBerkas:\n" + downloads + suffix;

            if (message.length > maxLength) {
              const fixedLength = message.length - notes.length;
              const notesBudget = Math.max(0, maxLength - fixedLength - 1);
              notes = Array.from(notes).slice(0, notesBudget).join("");
              if (notes.length < cleanNotes.length) {
                notes = notes.slice(0, Math.max(0, notes.length - 1)) + "…";
              }
              message = prefix + "\n" + notes + "\n\nBerkas:\n" + downloads + suffix;
            }

            if (message.length > 4096) {
              throw new Error("The release announcement is too long for Telegram.");
            }

            const assetButtons = uploadedAssets
              .slice(0, 6)
              .map(asset => [{
                text: "⬇️ " + asset.name.slice(0, 50),
                url: asset.browser_download_url
              }]);

            const replyMarkup = {
              inline_keyboard: [
                ...assetButtons,
                [
                  { text: "📝 Full Changelog", url: releaseUrl },
                  {
                    text: "📦 All Releases",
                    url: "https://github.com/" + context.repo.owner + "/" +
                      context.repo.repo + "/releases"
                  }
                ]
              ]
            };

            await sendTelegramMessage(message, replyMarkup);
