name: Test Java Telegram Bot

on:
  push:
    branches: [main]
    paths:
      - "bot/java-bot/**"
      - ".github/workflows/test-java-telegram-bot.yml"
  pull_request:
    paths:
      - "bot/java-bot/**"
      - ".github/workflows/test-java-telegram-bot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot/java-bot
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests and build
        run: mvn --batch-mode --no-transfer-progress verify
